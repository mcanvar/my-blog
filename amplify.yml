version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Deploys the Gen 2 backend for this branch and writes amplify_outputs.json.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        # Server-side env vars must be in .env.production to reach the SSR runtime.
        # Only non-public names are listed here; NEXT_PUBLIC_* are inlined at build time anyway.
        - env | grep -E '^INDEXNOW_KEY=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
