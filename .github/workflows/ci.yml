name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current.
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # No AWS access in CI: the site builds against in-memory fixtures.
      BLOG_DATA_SOURCE: fixtures
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Known vulnerabilities in what ships (build tooling is reviewed through Dependabot).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (fixtures)
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: website
    env:
      BLOG_DATA_SOURCE: fixtures
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # Amplify auto-build is off for `main`: it only builds after every check above passed,
  # so broken commits never reach a (paid) Amplify build.
  deploy:
    name: Deploy (Amplify)
    runs-on: ubuntu-latest
    needs: [secrets, check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: amplify-deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger the Amplify build for main
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$AMPLIFY_WEBHOOK_URL" ]; then
            echo "::warning::AMPLIFY_WEBHOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$AMPLIFY_WEBHOOK_URL" > /dev/null
          echo "Amplify build triggered for ${GITHUB_SHA::7}"
