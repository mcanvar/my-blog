name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # No AWS access in CI: the site builds against in-memory fixtures.
      BLOG_DATA_SOURCE: fixtures
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (fixtures)
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: website
    env:
      BLOG_DATA_SOURCE: fixtures
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7

  # Amplify auto-build is off for `main`: it only builds after every check above passed,
  # so broken commits never reach a (paid) Amplify build.
  deploy:
    name: Deploy (Amplify)
    runs-on: ubuntu-latest
    needs: [secrets, check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: amplify-deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger the Amplify build for main
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$AMPLIFY_WEBHOOK_URL" ]; then
            echo "::warning::AMPLIFY_WEBHOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$AMPLIFY_WEBHOOK_URL" > /dev/null
          echo "Amplify build triggered for ${GITHUB_SHA::7}"
