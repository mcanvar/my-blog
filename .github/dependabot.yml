version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      amplify:
        patterns: ["@aws-amplify/*", "aws-amplify", "aws-cdk-lib"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
